services:
  - type: web
    name: angela-interviewer
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_CODE
        sync: false
      - key: ELEVENLABS_AGENT_ID
        value: agent_9801m624gaj7enj9hj7zd11bqya5
      - key: ADMIN_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AVATAR_PROVIDER
        sync: false
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_ELEVENLABS_SECRET_ID
        sync: false
      - key: LIVEAVATAR_SANDBOX
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_FACE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
